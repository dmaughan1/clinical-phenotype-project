# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@oml/clinical-phenotype-project"
  version: 0.2.0
  title: Clinical Phenotype Project
  description: The Clinical Phenotype Project ontologies.

# source folders (method = vocabularies, model = descriptions)
sources:
  - src/method
  - src/model

# packaging: ship ONLY the reusable method (vocabulary, editor templates, generator, helpers).
# The T2DM sample model under src/model and its codegen config are intentionally excluded.
pack:
  - include: [src/method]

# default CLI arguments per command (see note at the bottom of this file).
#   pack   -> output the package tarball under build/dist
#   render -> render the T2DM model site (model md pages + description bundle) into build/web for GitHub Pages
defaults:
  pack: -o build/dist
  render: -m src/model/md -b build/web -c src/model/oml/www.example.com/phenotype/description/bundle.oml

# oml server settings
# By default the server binds a free port chosen by the OS (the actual port is
# reported by 'oml list'), so multiple workspaces never collide. Uncomment to
# pin a fixed port instead — but make sure no other workspace uses the same one.
# server:
#   port: 8080

# Default CLI arguments per command, injected before your own (so you can override them on the
# command line). Works for any oml command; key by command name. For example:
# defaults:
#   export: -o build/owl
#   reason: -o build/owl -t
